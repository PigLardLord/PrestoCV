name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · architecture check
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - name: Install the self-test's dependencies
        run: apt-get update -qq && apt-get install -y -qq git python3 > /dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache the checker build
        uses: actions/cache@v4
        with:
          path: Tools/ArchitectureCheck/.build
          key: checker-linux-${{ hashFiles('Tools/ArchitectureCheck/Package.resolved', 'Tools/ArchitectureCheck/Sources/**') }}
          restore-keys: checker-linux-
      - name: Architecture check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$BASE_REF" ]; then
            # The baseline may only shrink: compare it with the base branch's (ADR 0006).
            git show "origin/$BASE_REF:Tools/ArchitectureCheck/baseline.json" > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null \
              || echo "[]" > "$RUNNER_TEMP/base-baseline.json"
            Tools/ArchitectureCheck/check.sh --against "$RUNNER_TEMP/base-baseline.json"
          else
            Tools/ArchitectureCheck/check.sh
          fi
      - name: Checker self-test
        run: Tools/ArchitectureCheck/selftest.sh
      - name: Build and test the new targets
        # On Linux only the new targets exist; the legacy ones are declared for Apple hosts only (ADR 0012).
        run: |
          swift build --package-path PrestoCVApp
          for package in PrestoCVCore CVPDFExporter CVGeneratorAI; do
            swift test --package-path "$package"
          done

  macos:
    name: macOS · checks, packages and app
    # Self-hosted runner on the owner's Mac (issue #28). It sees the Apple-only manifest branches, which Linux cannot.
    runs-on: [self-hosted, macOS, prestocv-mac]
    # Only this repository's own branches run on the Mac, never a fork.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    env:
      # Build caches outside the checkout, which is cleaned between runs, and apart from the owner's own Xcode data.
      # Pull requests and pushes to main keep separate caches, so a pull request cannot leave state a main build reuses.
      ARCHITECTURE_CHECK_SCRATCH: ${{ github.workspace }}/../.prestocv-ci/${{ github.event_name }}/architecture-check
      DERIVED_DATA: ${{ github.workspace }}/../.prestocv-ci/${{ github.event_name }}/DerivedData
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Architecture check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git show "origin/$BASE_REF:Tools/ArchitectureCheck/baseline.json" > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null \
              || echo "[]" > "$RUNNER_TEMP/base-baseline.json"
            Tools/ArchitectureCheck/check.sh --against "$RUNNER_TEMP/base-baseline.json"
          else
            Tools/ArchitectureCheck/check.sh
          fi
      - name: Checker self-test
        run: Tools/ArchitectureCheck/selftest.sh
      - name: Package tests
        run: |
          for package in PrestoCVCore CVPDFExporter CVGeneratorAI; do
            swift test --package-path "$package"
          done
      - name: Build the app package
        # PrestoCVApp has no tests until step 5 (#88); building it checks its targets and cross-package dependencies.
        run: swift build --package-path PrestoCVApp
      - name: Build the exporter examples
        # The demos and the template viewer, apart from the library (R14); they use the legacy exporter, Apple hosts only.
        run: swift build --package-path CVPDFExporterExamples
      - name: App tests on the iOS simulator
        run: |
          DEVICE="$(Tools/CI/test-simulator.sh)"
          xcodebuild test -project PrestoCV.xcodeproj -scheme PrestoCV -derivedDataPath "$DERIVED_DATA" -destination "id=$DEVICE"
      - name: Exporter tests on the iOS simulator
        # The package scheme also builds the legacy targets, which do not build for iOS (ADR 0012); the shared
        # ExporterTests scheme holds the new test targets only. Simulator builds need no signing.
        working-directory: CVPDFExporter
        run: |
          DEVICE="$(../Tools/CI/test-simulator.sh)"
          xcodebuild test -scheme ExporterTests -derivedDataPath "$DERIVED_DATA-exporter" -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO
