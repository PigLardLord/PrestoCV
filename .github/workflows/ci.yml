name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · architecture check
    runs-on: ubuntu-latest
    # The Swift that .swift-version pins: 6.4.2, the Swift of Xcode 27.2 that Xcode Cloud builds with (ADR 0026).
    # Tools/check-linux.sh fails when they differ, and the source checks hold this file to .swift-version.
    container: swift:6.4.2
    steps:
      - name: Install the self-test's dependencies
        run: apt-get update -qq && apt-get install -y -qq git python3 > /dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache the checker build
        uses: actions/cache@v4
        with:
          path: Tools/ArchitectureCheck/.build
          key: checker-linux-swift-6.4.2-${{ hashFiles('Tools/ArchitectureCheck/Package.resolved', 'Tools/ArchitectureCheck/Sources/**') }}
          restore-keys: checker-linux-swift-6.4.2-
      - name: Linux checks
        # The script a computer runs too (ADR 0026): the toolchain against .swift-version, the architecture check against
        # the base branch's baseline, which may only shrink (ADR 0006), the checker's self-test, the source checks, and the
        # build and tests of the new targets, the only ones that exist on Linux (ADR 0012). The source checks also run in
        # ci_scripts/ci_post_xcodebuild.sh (the Mac mini check, the Release build), not in the test plans.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          Tools/check-linux.sh ${BASE_REF:+"origin/$BASE_REF"}

  android:
    name: Android · build of the portable targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Swift SDK for Android must match the host toolchain exactly. 6.4.2 is the Swift of Xcode 27.2, which Xcode
      # Cloud builds with, and of the Linux job, as .swift-version pins (ADR 0026). Both downloads are checked against these checksums.
      SWIFT_VERSION: 6.4.2
      SWIFT_TOOLCHAIN_SHA256: 2e9ebec040ad459dd89a6d093a02d8314939135104850fae4d5c0f174fb3ba8c
      SWIFT_ANDROID_SDK_SHA256: 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      # The NDK r30 of the ubuntu-24.04 runner image, the version the SDK asks for.
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/30.0.16248370
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache the Swift toolchain
        id: toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/swift-toolchain
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu24.04-${{ env.SWIFT_TOOLCHAIN_SHA256 }}
      - name: Install Swift and its SDK for Android
        # The setup documented on swift.org: the toolchain, the SDK installed with its checksum, then the SDK linked to
        # the NDK.
        env:
          TOOLCHAIN_CACHED: ${{ steps.toolchain.outputs.cache-hit }}
        run: |
          release="swift-$SWIFT_VERSION-RELEASE"
          base="https://download.swift.org/swift-$SWIFT_VERSION-release"
          if [ "$TOOLCHAIN_CACHED" != "true" ]; then
            curl -fsSL --retry 5 -o "$RUNNER_TEMP/swift.tar.gz" "$base/ubuntu2404/$release/$release-ubuntu24.04.tar.gz"
            echo "$SWIFT_TOOLCHAIN_SHA256  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
            mkdir -p ~/swift-toolchain
            tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C ~/swift-toolchain --strip-components 1
            rm "$RUNNER_TEMP/swift.tar.gz"
          fi
          ~/swift-toolchain/usr/bin/swift sdk install --swift-sdks-path ~/swift-sdks \
            "$base/android-sdk/$release/${release}_android.artifactbundle.tar.gz" --checksum "$SWIFT_ANDROID_SDK_SHA256"
          ~/swift-sdks/"${release}_android.artifactbundle"/swift-android/scripts/setup-android-sdk.sh
      - name: Build the portable targets for Android
        # On a Linux host the manifests declare only the targets that build on Linux (ADR 0012), and every one of them
        # must build for Android too: arm64, API level 28. The tests do not run on an emulator yet.
        run: |
          for package in DiagnosticLogging DiagnosticTrace PrestoCVCore CVPDFExporter CVGeneratorAI PrestoCVApp; do
            ~/swift-toolchain/usr/bin/swift build --package-path "$package" \
              --swift-sdks-path ~/swift-sdks --swift-sdk aarch64-unknown-linux-android28
          done
